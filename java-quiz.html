<style>
/* Layout: single-column study tool; set picker -> one question per screen with instant feedback -> result review */
:root{--bg:#f5f6f4;--surface:#fff;--fg:#17211e;--muted:#5d6b66;--line:#dbe0dc;--accent:#0b6b5c;--accent-fg:#fff;--ok:#1b7a43;--ok-bg:#e3f4e9;--bad:#b3261e;--bad-bg:#fbe7e5;--warn:#8a5a00;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-size:1.05rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.set:hover{border-color:var(--accent)}
.set b{font-size:1rem}
.set .mods{color:var(--muted);font-size:.85rem}
.set .meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.chk{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.92rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.top .t{font-weight:600}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin:12px 0 18px}
.nav button{height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:.8rem;font-variant-numeric:tabular-nums;padding:0}
.nav button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.nav button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.nav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.qtag{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.q{font-size:1.08rem;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:.85rem;border:1px solid var(--line);border-radius:4px;min-width:24px;height:24px;display:grid;place-items:center;flex:none;background:var(--surface)}
.opt .x{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--fg)}
.verdict{margin-top:14px;font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.score{font-size:2.4rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.rev{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.rev .card{padding:14px}
.rev .a{font-size:.92rem;margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rev .a.ok{color:var(--ok)}.rev .a.bad{color:var(--bad)}
.tt{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.site-nav{max-width:760px;margin:0 auto 20px;display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.site-nav a{color:var(--fg);text-decoration:none;padding:6px 12px;border-radius:6px;border:1px solid transparent;font-size:.92rem}
.site-nav a:hover{border-color:var(--accent)}
.site-nav a[aria-current="page"]{background:var(--accent);color:var(--accent-fg);font-weight:500}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s}}
.explain{margin-top:14px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:.92rem;line-height:1.55}
.explain .etitle{font-weight:600;font-size:.84rem;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.explain .ebody{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}

const MODS={1:'Introduction to Java',2:'Java and Object Based Programming',3:'Access Control, Inheritance and Interfaces',4:'Memory Management, Java Beans and Keywords',5:'Collections',6:'Exception Handling',7:'Multithreaded Programming',8:'Java IO',9:'Objects, Immutable, Wrapper Classes, Serialization',10:'JDBC',11:'GUI Building with AWT and Applets',12:'Java Swing',13:'Network Programming',14:'XML and Java',15:'Java Lang and Util Packages',16:'Internationalization and Security'};
const Q=D.map((r,i)=>({id:i,m:r[0],q:r[1],o:r[2],c:r[3],exp:(typeof JAVA_EXP!=='undefined'&&JAVA_EXP[i])||r[4]||''}));
const SETS=[];for(let s=0;s<8;s++){const ms=[2*s+1,2*s+2];SETS.push({id:'s'+(s+1),name:'Quiz '+(s+1),mods:ms,ids:Q.filter(x=>ms.includes(x.m)).map(x=>x.id)})}
const KEY='corejava-quiz-v1';
let store={best:{},wrong:[],shuffle:true};
try{const s=JSON.parse(sessionStorage.getItem(KEY));if(s)store=Object.assign(store,s)}catch(e){}
const save=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const RK=KEY+':run';
const saveRun=()=>{try{if(run)sessionStorage.setItem(RK,JSON.stringify({name:run.name,i:run.i,isAll:run.isAll,items:run.items.map(x=>({id:x.q.id,ord:x.ord,pick:x.pick}))}))}catch(e){}};
const loadRun=()=>{try{const s=JSON.parse(sessionStorage.getItem(RK));if(!s)return null;return{name:s.name,i:s.i,isAll:s.isAll,items:s.items.map(x=>({q:Q[x.id],ord:x.ord,pick:x.pick}))}}catch(e){return null}};
const clearRun=()=>{try{sessionStorage.removeItem(RK)}catch(e){}};
const $=(t,p={},...k)=>{const e=document.createElement(t);for(const a in p){if(a==='class')e.className=p[a];else if(a.startsWith('on'))e.addEventListener(a.slice(2),p[a]);else e.setAttribute(a,p[a])}k.flat().forEach(c=>e.append(c));return e};
const app=document.getElementById('app');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let run=null;

function home(){
  run=null;app.replaceChildren();
  app.append($('h1',{},'Core Java Quiz'),$('p',{class:'sub'},`${Q.length} câu trắc nghiệm, 16 module, chia thành 8 bộ 40 câu.`));
  const sv=loadRun();
  if(sv){const dn=sv.items.filter(x=>x.pick!==null).length;
    app.append($('div',{class:'card',style:'margin-bottom:16px'},$('b',{},'Bài đang làm dở: '+sv.name),$('p',{class:'sub',style:'margin:4px 0 10px'},`Đã làm ${dn}/${sv.items.length} câu`),$('div',{class:'row'},$('button',{class:'btn primary',onclick:()=>{run=sv;step()}},'Tiếp tục'),$('button',{class:'btn',onclick:()=>{clearRun();home()}},'Bỏ bài này'))))}
  const g=$('div',{class:'grid'});
  SETS.forEach(s=>{
    const b=store.best[s.id];
    g.append($('button',{class:'set',onclick:()=>start(s.name,s.ids)},
      $('b',{},`${s.name} · ${s.ids.length} câu`),
      $('span',{class:'mods'},s.mods.map(m=>`M${m} ${MODS[m]}`).join(' · ')),
      $('div',{class:'bar'},$('i',{style:`width:${b?b.pct:0}%`})),
      $('span',{class:'meta'},$('span',{},b?`Tốt nhất ${b.score}/${b.total}`:'Chưa làm'),$('span',{},b?b.pct+'%':''))));
  });
  app.append(g,$('h2',{},'Ôn tập'));
  const r=$('div',{class:'row'},
    $('button',{class:'btn',onclick:()=>start('Ngẫu nhiên 40 câu',shuf(Q.map(x=>x.id)).slice(0,40))},'40 câu ngẫu nhiên'),
    $('button',{class:'btn',onclick:()=>start('Toàn bộ 320 câu',shuf(Q.map(x=>x.id)),true)},'Toàn bộ 320 câu (xáo trộn)'),
    $('button',{class:'btn',disabled:store.wrong.length?null:'',onclick:()=>start('Ôn câu đã sai',shuf(store.wrong))},`Ôn câu đã sai (${store.wrong.length})`));
  r.querySelectorAll('button[disabled=""]').forEach(b=>b.disabled=true);
  const cb=$('input',{type:'checkbox',id:'shuf'});cb.checked=store.shuffle;cb.onchange=()=>{store.shuffle=cb.checked;save()};
  app.append(r,$('div',{style:'margin-top:14px'},$('label',{class:'chk',for:'shuf'},cb,'Xáo trộn thứ tự đáp án')));
  app.append($('h2',{},'Danh sách module'),$('div',{class:'sub'},Object.entries(MODS).map(([k,v])=>`M${k}: ${v}`).join(' · ')));
}

function start(name,ids,isAll){
  run={name,items:ids.map(id=>{const q=Q[id];const ord=store.shuffle?shuf(q.o.map((_,i)=>i)):q.o.map((_,i)=>i);return{q,ord,pick:null}}),i:0,isAll};
  step();
}

  const done=items.filter(x=>x.pick!==null).length;
  app.replaceChildren();
  app.append($('div',{class:'top'},$('span',{class:'t'},run.name),$('span',{class:'prog'},`Câu ${i+1}/${items.length} · Đã làm ${done} · Đúng ${items.filter(x=>x.pick===x.q.c).length}`),$('button',{class:'btn',onclick:home},'Thoát')));
  const nav=$('div',{class:'nav'});
  items.forEach((x,k)=>nav.append($('button',{class:(x.pick===null?'':x.pick===x.q.c?'ok':'bad')+(k===i?' cur':''),'aria-label':'Câu '+(k+1),onclick:()=>{run.i=k;step()}},String(k+1))));
  const card=$('div',{class:'card'},$('div',{class:'qtag'},`Module ${q.m} · ${MODS[q.m]}`),$('p',{class:'q'},q.q));
  const ol=$('div',{class:'opts'});
  it.ord.forEach((oi,pos)=>{
    let cls='opt';
    if(it.pick!==null){if(oi===q.c)cls+=' ok';else if(oi===it.pick)cls+=' bad'}
    const b=$('button',{class:cls,onclick:()=>answer(oi)},$('span',{class:'k'},L(pos)),$('span',{class:'x'},q.o[oi]));
    if(it.pick!==null)b.disabled=true;ol.append(b);
  });
  card.append(ol);
  if(it.pick!==null){
    const ok=it.pick===q.c;
    card.append($('div',{class:'verdict '+(ok?'ok':'bad')},ok?'Chính xác.':'Sai. Đáp án đúng: '+q.o[q.c]));
    if(q.exp){
      card.append($('div',{class:'explain'},
        $('div',{class:'etitle'},'💡 Giải thích:'),
        $('div',{class:'ebody'},q.exp)));
    }
  }
  const last=i===items.length-1;
  card.append($('div',{class:'foot'},
    $('button',{class:'btn',disabled:i?null:'',onclick:()=>{run.i--;step()}},'Câu trước'),
    last?$('button',{class:'btn primary',onclick:finish},'Nộp bài'):$('button',{class:'btn primary',onclick:()=>{run.i++;step()}},'Câu tiếp')));
  card.querySelectorAll('button[disabled=""]').forEach(b=>b.disabled=true);
  app.append(nav,card);
  window.scrollTo(0,0);
}
function answer(oi){const it=run.items[run.i];if(it.pick!==null)return;it.pick=oi;step()}

function finish(){
  const {items}=run,total=items.length,score=items.filter(x=>x.pick===x.q.c).length,skipped=items.filter(x=>x.pick===null).length;
  const pct=Math.round(score*100/total);
  const setId=(SETS.find(s=>s.name===run.name)||{}).id;
  if(setId&&(!store.best[setId]||store.best[setId].pct<pct))store.best[setId]={score,total,pct};
  const wrongIds=items.filter(x=>x.pick!==x.q.c).map(x=>x.q.id);
  const rightIds=items.filter(x=>x.pick===x.q.c).map(x=>x.q.id);
  store.wrong=[...new Set([...store.wrong.filter(id=>!rightIds.includes(id)),...items.filter(x=>x.pick!==null&&x.pick!==x.q.c).map(x=>x.q.id)])];
  save();clearRun();
  app.replaceChildren();
  app.append($('h1',{},run.name),$('div',{class:'score'},`${score}/${total}`),$('p',{class:'sub'},`${pct}% đúng · ${total-score-skipped} sai · ${skipped} chưa làm`));
  const retryIds=items.filter(x=>x.pick!==x.q.c).map(x=>x.q.id);
  app.append($('div',{class:'row'},
    $('button',{class:'btn primary',onclick:home},'Về danh sách'),
    $('button',{class:'btn',onclick:()=>start(run.name,shuf(items.map(x=>x.q.id)))},'Làm lại'),
    $('button',{class:'btn',disabled:retryIds.length?null:'',onclick:()=>start('Làm lại câu sai',retryIds)},`Làm lại câu sai (${retryIds.length})`)));
  app.querySelectorAll('button[disabled=""]').forEach(b=>b.disabled=true);
  const wr=items.filter(x=>x.pick!==x.q.c);
  if(wr.length){
    app.append($('h2',{},'Câu sai và câu bỏ qua'));
    const rv=$('div',{class:'rev'});
    wr.forEach(x=>{
      const cd=$('div',{class:'card'},
        $('div',{class:'qtag'},`Module ${x.q.m}`),$('p',{class:'q',style:'font-size:1rem'},x.q.q),
        x.pick!==null?$('div',{class:'a bad'},'Bạn chọn: '+x.q.o[x.pick]):$('div',{class:'a bad'},'Chưa trả lời'),
        $('div',{class:'a ok'},'Đáp án đúng: '+x.q.o[x.q.c]));
      if(x.q.exp){
        cd.append($('div',{class:'explain',style:'margin-top:10px'},
          $('div',{class:'etitle'},'💡 Giải thích:'),
          $('div',{class:'ebody'},x.q.exp)));
      }
      rv.append(cd);
    });
    app.append(rv);
  }
  window.scrollTo(0,0);
}
home();
</script>
